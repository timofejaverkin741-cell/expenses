<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Регистрация')}"></head>
<body class="auth-page">
<aside th:replace="~{fragments :: authBrand}"></aside>
<main class="auth-main">
<div class="auth-card">
    <h2 class="card-title">Регистрация</h2>

    <form th:action="@{/register}" th:object="${form}" method="post" class="form" novalidate>
        <label class="field">
            <span class="field-label">Логин</span>
            <input type="text" th:field="*{login}" autocomplete="username" autofocus
                   th:classappend="${#fields.hasErrors('login')} ? 'is-invalid'">
            <span class="field-error" th:if="${#fields.hasErrors('login')}" th:errors="*{login}"></span>
        </label>

        <label class="field">
            <span class="field-label">Пароль</span>
            <input type="password" th:field="*{password}" autocomplete="new-password"
                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
            <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </label>

        <label class="field">
            <span class="field-label">Повторите пароль</span>
            <input type="password" th:field="*{confirmPassword}" autocomplete="new-password"
                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
            <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}"
                  th:errors="*{confirmPassword}"></span>
        </label>

        <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
    </form>

    <p class="auth-switch">Уже есть аккаунт? <a th:href="@{/login}">Войти</a></p>
</div>
</main>
</body>
</html>
